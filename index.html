<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya - Digital CV</title>
    <style>
      /* CSS untuk mempercantik tampilan */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #71b7e6, #9b59b6);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background: #fff;
        width: 350px;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      .profile-pic {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 5px solid #f0f0f0;
        object-fit: cover;
        margin-bottom: 15px;
      }
      h1 {
        margin: 10px 0;
        color: #333;
        font-size: 24px;
      }
      .job {
        color: #9b59b6;
        font-weight: bold;
        margin-bottom: 20px;
        display: block;
      }
      .bio {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
      }
      .social {
        margin-top: 25px;
      }
      .social a {
        text-decoration: none;
        background: #333;
        color: #fff;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 13px;
        transition: 0.3s;
      }
      .social a:hover {
        background: #9b59b6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="jalal.jpg" alt="Foto Profil" class="profile-pic" />

      <h1>Jalal</h1>
      <span class="job">Web Developer & Student</span>

      <p class="bio">
        Halo! Saya adalah pemula yang sedang belajar membangun dunia melalui
        baris kode. Senang belajar hal baru dan hobi saya adalah bereksperimen
        dengan HTML.
      </p>

      <div class="social">
        <a
          href="https://www.instagram.com/jald_24?igsh=dXFwYmh6YXBvM3dm"
          target="_blank"
          >Follow Saya</a
        >
      </div>
    </div>
  </body>
</html>
